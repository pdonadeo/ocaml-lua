name: Main workflow

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        ocaml-compiler:
          - "4.14"
          - "5.2"
          - "5.3"
          - "5.4"
          - "5.5"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: opam install . --deps-only --with-doc

      # Release profile: warnings in the (old, untouched) code must not
      # become errors when a newer compiler adds new warnings.
      - run: opam exec -- dune build --profile release

      - run: opam exec -- dune build --profile release @doc

  # The runners' C compiler is too recent to build OCaml 4.11, so the declared
  # lower bounds (OCaml 4.11, dune 2.3) are checked inside an official
  # ocaml/opam image instead.
  lower-bounds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Build with OCaml 4.11 and dune 2.3.0
        run: |
          docker run --rm -v "$PWD:/src:ro" ocaml/opam:debian-11-ocaml-4.11 sh -exc '
            opam install -y dune.2.3.0
            cp -r /src /tmp/w
            cd /tmp/w
            opam exec -- dune build -p ocaml-lua @install
            opam exec -- dune build --profile release tests/cpcall.exe tests/atpanic.exe tests/userdata.exe tests/fasta_threads.exe
            timeout 60 ./_build/default/tests/fasta_threads.exe 4 1000 > /dev/null
          '
