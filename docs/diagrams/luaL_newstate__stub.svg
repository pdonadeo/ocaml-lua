<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">
  <title>Memory layout after luaL_newstate__stub() returns</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .mono { font-family: 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 13px; }
      .title { font-size: 22px; font-weight: 700; }
      .region { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
      .region-sub { font-size: 12px; fill: #4b5563; }
      .card { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
      .head-c { fill: #ede9fe; }
      .head-o { fill: #dcfce7; }
      .head-p { fill: #e0f2fe; }
      .name { font-size: 15px; font-weight: 700; }
      .sub { font-size: 12px; fill: #4b5563; }
      .note { font-size: 12px; fill: #4b5563; font-style: italic; }
      .sep { stroke: #d1d5db; stroke-width: 1; }
      .ptr { fill: none; stroke: #374151; stroke-width: 1.6; }
      .root { fill: none; stroke: #374151; stroke-width: 1.6; stroke-dasharray: 6 4; }
      .lbl { font-size: 12px; fill: #374151; }
    </style>
  </defs>

  <rect width="1000" height="690" fill="#ffffff"/>

  <text class="title" x="500" y="42" text-anchor="middle">Memory layout after <tspan class="mono" font-size="20">luaL_newstate__stub()</tspan> returns</text>

  <!-- OCaml program -->
  <rect class="card" x="370" y="70" width="260" height="84" rx="8"/>
  <path class="head-p" d="M378,70 h244 a8,8 0 0 1 8,8 v28 h-260 v-28 a8,8 0 0 1 8,-8 z"/>
  <text class="name" x="500" y="94" text-anchor="middle">OCaml program</text>
  <line class="sep" x1="370" y1="106" x2="630" y2="106"/>
  <text class="mono" x="500" y="134" text-anchor="middle">let l = LuaL.newstate ()</text>

  <!-- Regions -->
  <rect x="30" y="190" width="450" height="430" rx="14" fill="#faf8ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text class="region" x="50" y="216">C heap</text>
  <text class="region-sub" x="50" y="234">outside the OCaml heap, never moved by the GC</text>

  <rect x="520" y="190" width="450" height="430" rx="14" fill="#f6fdf8" stroke="#4ade80" stroke-width="1.5"/>
  <text class="region" x="540" y="216">OCaml heap</text>
  <text class="region-sub" x="540" y="234">managed (and possibly moved) by the GC</text>

  <!-- lua_State -->
  <rect class="card" x="60" y="256" width="390" height="80" rx="6"/>
  <path class="head-c" d="M66,256 h378 a6,6 0 0 1 6,6 v40 h-390 v-40 a6,6 0 0 1 6,-6 z"/>
  <text class="name mono" x="76" y="277" font-size="15">lua_State</text>
  <text class="sub" x="76" y="295">created by lua_newstate() with custom_alloc</text>
  <line class="sep" x1="60" y1="302" x2="450" y2="302"/>
  <text class="mono" x="76" y="324">registry[UUID]["ocaml_data"]</text>

  <!-- ocaml_data -->
  <rect class="card" x="60" y="420" width="390" height="176" rx="6"/>
  <path class="head-c" d="M66,420 h378 a6,6 0 0 1 6,6 v40 h-390 v-40 a6,6 0 0 1 6,-6 z"/>
  <text class="name mono" x="76" y="441" font-size="15">ocaml_data</text>
  <text class="sub" x="76" y="459">allocated with caml_stat_alloc()</text>
  <line class="sep" x1="60" y1="466" x2="450" y2="466"/>
  <text class="mono" x="76" y="488">state_value    : value</text>
  <text class="note" x="76" y="505">registered as a global root</text>
  <line class="sep" x1="60" y1="514" x2="450" y2="514"/>
  <text class="mono" x="76" y="536">panic_callback : value</text>
  <text class="note" x="76" y="553">registered as a global root</text>
  <line class="sep" x1="60" y1="562" x2="450" y2="562"/>
  <text class="mono" x="76" y="584">ad : allocator_data</text>
  <text class="note" x="290" y="584">max / used memory</text>

  <!-- v_L -->
  <rect class="card" x="550" y="256" width="390" height="108" rx="6"/>
  <path class="head-o" d="M556,256 h378 a6,6 0 0 1 6,6 v40 h-390 v-40 a6,6 0 0 1 6,-6 z"/>
  <text class="name mono" x="566" y="277" font-size="15">v_L</text>
  <text class="sub" x="606" y="277">custom block (lua_State_ops)</text>
  <text class="sub" x="566" y="295">the value returned to OCaml</text>
  <line class="sep" x1="550" y1="302" x2="940" y2="302"/>
  <text class="mono" x="566" y="324">lua_State *L</text>
  <rect x="566" y="334" width="200" height="22" rx="11" fill="#fff7ed" stroke="#f59e0b"/>
  <text class="lbl" x="666" y="349" text-anchor="middle">finalizer: finalize_lua_State</text>

  <!-- v_L_mirror -->
  <rect class="card" x="550" y="384" width="390" height="108" rx="6"/>
  <path class="head-o" d="M556,384 h378 a6,6 0 0 1 6,6 v40 h-390 v-40 a6,6 0 0 1 6,-6 z"/>
  <text class="name mono" x="566" y="405" font-size="15">v_L_mirror</text>
  <text class="sub" x="666" y="405">custom block (default_lua_State_ops)</text>
  <text class="sub" x="566" y="423">internal copy, used by the C stubs</text>
  <line class="sep" x1="550" y1="430" x2="940" y2="430"/>
  <text class="mono" x="566" y="452">lua_State *L</text>
  <rect x="566" y="462" width="130" height="22" rx="11" fill="#f3f4f6" stroke="#9ca3af"/>
  <text class="lbl" x="631" y="477" text-anchor="middle">no finalizer</text>

  <!-- default_panic -->
  <rect class="card" x="550" y="512" width="390" height="84" rx="6"/>
  <path class="head-o" d="M556,512 h378 a6,6 0 0 1 6,6 v40 h-390 v-40 a6,6 0 0 1 6,-6 z"/>
  <text class="name mono" x="566" y="533" font-size="15">default_panic</text>
  <text class="sub" x="700" y="533">OCaml closure</text>
  <text class="sub" x="566" y="551">provided by the library, read with caml_named_value()</text>
  <line class="sep" x1="550" y1="558" x2="940" y2="558"/>
  <text class="mono" x="566" y="582">state -&gt; int</text>

  <!-- Arrows -->
  <!-- OCaml program -> v_L -->
  <path class="ptr" d="M630,112 C 860,112 860,180 860,252" marker-end="url(#arrow)"/>
  <text class="lbl" x="700" y="102" text-anchor="middle">CAMLreturn(v_L)</text>

  <!-- v_L -> lua_State -->
  <path class="ptr" d="M550,319 C 510,319 490,296 454,296" marker-end="url(#arrow)"/>
  <!-- v_L_mirror -> lua_State -->
  <path class="ptr" d="M550,447 C 500,447 500,322 454,322" marker-end="url(#arrow)"/>

  <!-- lua_State -> ocaml_data -->
  <path class="ptr" d="M255,336 L255,416" marker-end="url(#arrow)"/>
  <text class="lbl" x="265" y="372">light userdata in a private</text>
  <text class="lbl" x="265" y="388">table of the Lua registry</text>

  <!-- ocaml_data.state_value -> v_L_mirror -->
  <path class="root" d="M450,490 C 505,490 505,470 546,470" marker-end="url(#arrow)"/>
  <!-- ocaml_data.panic_callback -> default_panic -->
  <path class="root" d="M450,538 C 505,538 505,570 546,570" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line class="ptr" x1="60" y1="652" x2="110" y2="652" marker-end="url(#arrow)"/>
  <text class="lbl" x="120" y="656">pointer</text>
  <line class="root" x1="210" y1="652" x2="260" y2="652" marker-end="url(#arrow)"/>
  <text class="lbl" x="270" y="656">pointer registered with <tspan class="mono" font-size="12">caml_register_global_root()</tspan>: keeps the target alive</text>
</svg>
